# Epic 66 — инфраструктурные сервисы для admin_bot.
# Бот работает ХОСТОВЫМ python-процессом (systemd unit admin_bot),
# поэтому порты публикуются строго на 127.0.0.1.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: adminbot-telegram-bot-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
    volumes:
      # D263: путь на хосте == путь в контейнере → file_path резолвится напрямую
      - ./docker/telegram-bot-api:/var/lib/telegram-bot-api
    healthcheck:
      # базовый образ debian-based; если wget/curl отсутствуют — healthcheck
      # допустимо опустить (restart: unless-stopped остаётся предохранителем)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: adminbot-cobalt
    init: true
    read_only: true
    restart: unless-stopped
    # Epic 73 hotfix (v2.47.2, Section 74.A/D271): xray слушает ТОЛЬКО
    # 127.0.0.1:10808 на хосте (его конфиг не наш — трогать нельзя), из
    # bridge-сети gateway 172.17.0.1:10808 → PORT_CLOSED → cobalt ходил на
    # YouTube напрямую → error.api.fetch.fail. network_mode host кладёт cobalt
    # в сетевой стек хоста: 127.0.0.1:10808 доступен напрямую.
    # С host-сетью ports/extra_hosts не работают и не нужны:
    # API_PORT=9000 слушает прямо на хосте.
    network_mode: "host"
    environment:
      # единственный ОБЯЗАТЕЛЬНЫЙ env cobalt (docs/api-env-variables.md);
      # должен быть валидным URL, иначе tunnel'ы не работают
      API_URL: "http://localhost:9000/"
      API_PORT: "9000"
      # Митигация host-сети ПРИМЕНЕНА: cobalt слушает ТОЛЬКО loopback:9000
      # (docs/api-env-variables.md, «networking vars»: API_LISTEN_ADDRESS,
      # default 0.0.0.0) — порт 9000 недоступен с внешних интерфейсов хоста.
      API_LISTEN_ADDRESS: "127.0.0.1"
      # Epic 72 (74.A): исходящий прокси для закачки YouTube (undici
      # EnvHttpProxyAgent; API_EXTERNAL_PROXY deprecated; SOCKS НЕ поддерживается)
      HTTP_PROXY: "${COBALT_HTTP_PROXY:-}"
      HTTPS_PROXY: "${COBALT_HTTP_PROXY:-}"
      NO_PROXY: "localhost,127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Epic 77 (D290): PO Token провайдер для yt-dlp (YouTube «Sign in to
  # confirm…»). Плагин (pip-пакет bgutil-ytdlp-pot-provider в venv ХОСТА)
  # ходит на http://127.0.0.1:4416 — дефолтный endpoint HTTP-режима,
  # конфигурация не нужна. Порт строго на loopback хоста (конвенция
  # проекта: сервисы наружу не публикуются).
  bgutil-ytdlp-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: adminbot-bgutil-pot
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"
