[pytest]
testpaths = tests
timeout = 60
timeout_method = thread
markers =
    system2: тесты двухвызовных пайплайнов System 2 / egress-предохранителя (раунд 10.22)
    asap3: тесты Direct Context Composer / Decision Matrix ASAP-3 (round 1028, ADR-1028-2; изоляция в conftest)
    asap31: тесты Auto Budgets / Capacity / LLM REACT / Summary coverage ASAP-3.1 (round 1028, ADR-1028-3; изоляция в conftest)
    asap32: тесты Runtime Reliability ASAP-3.2 (round 1029, ADR-1028-5; изоляция в conftest)
    asap4: тесты Embedding Control Plane / Cover / Summary full-window ASAP-4 (round 1029, ADR-1028-7; изоляция в conftest)
    asap41: Фича ASAP 4.1 Durable Whole-Window Summary / SourceWindow + capacity engine (round 1030, ADR-1028-8; изолируется conftest)
